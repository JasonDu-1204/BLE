workflows:
  ios-sideload:
    name: iOS 免签名构建（侧载用）
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 获取依赖
        script: flutter pub get
      - name: 构建未签名 iOS 应用
        script: flutter build ios --release --no-codesign
      - name: 打包为 IPA
        script: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/Runner.app
          zip -r BleProx-Lock-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa
